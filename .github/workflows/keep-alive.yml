name: Keep Streamlit app awake

on:
  schedule:
    # Cada 4 horas — margen amplio sobre la ventana de 12hs sin tráfico que usa
    # Streamlit Community Cloud para dormir una app (el cron de GitHub se atrasa).
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Abrir la app en un navegador real (despierta si está dormida)
        run: python .github/scripts/keep_alive.py

      - name: Guardar captura si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-alive-fail
          path: keep_alive_fail.png
          if-no-files-found: ignore
